<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Surprise | Priyanshi</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --magic-gold: #ffd700;
            --magic-purple: #240046;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0f0c29;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- NEXT LEVEL ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px var(--magic-gold)); }
            50% { filter: drop-shadow(0 0 30px #fff700); }
        }

        @keyframes smokeExpand {
            0% { transform: scale(0); opacity: 0; filter: blur(10px); }
            50% { transform: scale(1.5); opacity: 1; filter: blur(20px); }
            100% { transform: scale(4); opacity: 0; filter: blur(40px); }
        }

        /* --- LAMP PAGE --- */
        #page1 {
            text-align: center;
            transition: opacity 1s ease-in-out;
        }

        .lamp-wrapper {
            position: relative;
            cursor: pointer;
            animation: float 4s ease-in-out infinite;
        }

        #lamp-img {
            font-size: 120px;
            animation: glow 2s infinite;
            user-select: none;
        }

        #smoke-effect {
            position: absolute;
            top: 20%;
            left: 50%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fff, #a29bfe, transparent);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .genie-text {
            display: none;
            margin-top: 20px;
            animation: fadeIn 1.5s forwards;
        }

        /* --- BIRTHDAY PAGE --- */
        #page2 {
            display: none;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #ff758c, #ff7eb3);
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            overflow-y: auto;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 450px;
            animation: slideUp 1s ease-out;
        }

    /* Isko wahan paste kar de */
.slideshow-frame {
    width: 100%;
    min-height: 300px; 
    max-height: 500px;
    border-radius: 20px;
    overflow: hidden;
    border: 4px solid white;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.1); 
}

#slide-img {
    max-width: 100%;
    max-height: 500px;
    height: auto;
    object-fit: contain; /* Isse photo nahi kategi */
    transition: opacity 0.8s ease-in-out;
}


        .wish-input {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            width: 80%;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .magic-btn {
            background: linear-gradient(45deg, #ffd700, #ff9f00);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .magic-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px gold; }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="page1">
        <h2 id="hint-text">Rub the lamp 3 times to summon the Genie...</h2>
        <div class="lamp-wrapper" onclick="handleRub()">
            <div id="smoke-effect"></div>
            <div id="lamp-img">🪔</div>
        </div>

        <div id="genie-ui" class="genie-text">
            <h1 style="font-size: 50px; margin: 0;">🧞‍♂️</h1>
            <h3>"I am the Genie of Birthdays! Ask for a wish, Priyanshi."</h3>
            <input type="text" id="wishText" class="wish-input" placeholder="Your secret wish..."><br>
            <button class="magic-btn" onclick="grantWish()">Grant Wish ✨</button>
        </div>
    </div>

    <div id="page2">
        <div class="main-card">
            <h1 style="margin-top:0;">Happy Birthday, Priyanshi! 🎂</h1>
            <div class="slideshow-frame">
                <img id="slide-img" src="photo1.jpg" alt="Memories">
            </div>
            <div id="typewriter-note" style="font-size: 18px; line-height: 1.5; min-height: 100px;"></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() { emailjs.init("R2J4WoqG1vVEahNbF"); })();

        let rubCount = 0;
        const smoke = document.getElementById('smoke-effect');
        const genieUI = document.getElementById('genie-ui');
        const hint = document.getElementById('hint-text');

        function handleRub() {
            rubCount++;
            // Shake effect on click
            document.getElementById('lamp-img').style.transform = "rotate(15deg)";
            setTimeout(() => { document.getElementById('lamp-img').style.transform = "rotate(0deg)"; }, 100);

            if (rubCount === 3) {
                smoke.style.animation = "smokeExpand 1.5s forwards";
                setTimeout(() => {
                    document.getElementById('lamp-img').style.display = "none";
                    hint.style.display = "none";
                    genieUI.style.display = "block";
                }, 800);
            }
        }

        function grantWish() {
            const wish = document.getElementById('wishText').value;
            if(!wish) return alert("Genie needs a wish, Aaka!");

            emailjs.send("service_07qqc6k", "template_ijxvpcp", {
                message: wish,
                to_name: "Priyanshi"
            }).then(() => {
                transitionToBirthday();
            });
        }

        function transitionToBirthday() {
            document.getElementById('page1').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('page1').style.display = "none";
                const p2 = document.getElementById('page2');
                p2.style.display = "flex";
                document.getElementById('bgMusic').play();
                startEverything();
            }, 1000);
        }

        function startEverything() {
            // 1. Slideshow
            const images = ["photo1.jpg", "photo2.jpg", "photo3.jpg"];
            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % images.length;
                const img = document.getElementById('slide-img');
                img.style.opacity = "0";
                setTimeout(() => {
                    img.src = images[idx];
                    img.style.opacity = "1";
                }, 400);
            }, 3000);

            // 2. Typewriter
            const note = "hi Priyanshi, aap sach me special hai! Is saal apke saare sapne pure ho aur apki smile hamesha aise hi bani rahe. Ye chota sa surprise apke liye! Have a blast! ❤️";
            let i = 0;
            function type() {
                if (i < note.length) {
                    document.getElementById("typewriter-note").innerHTML += note.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();

            // 3. Floating Sparkles (Next Level)
            setInterval(createSparkle, 200);
        }

        function createSparkle() {
            const sparkle = document.createElement("div");
            sparkle.innerHTML = "✨";
            sparkle.style.position = "absolute";
            sparkle.style.left = Math.random() * 100 + "vw";
            sparkle.style.top = "100vh";
            sparkle.style.fontSize = "20px";
            sparkle.style.transition = "all 4s linear";
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                sparkle.style.opacity = "0";
            }, 100);
            
            setTimeout(() => { sparkle.remove(); }, 4000);
        }
    </script>
</body>
</html>
