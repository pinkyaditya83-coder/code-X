<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Birthday | Priyanshi</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --magic-gold: #ffd700;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #0f0c29;
            color: white;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- PAGE 1: MAGIC LAMP --- */
        #page1 {
            text-align: center;
            transition: opacity 0.8s ease;
            width: 100%;
        }

        .lamp-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            animation: float 4s ease-in-out infinite;
        }

        #lamp-img {
            font-size: 120px;
            filter: drop-shadow(0 0 10px var(--magic-gold));
            transition: transform 0.2s;
            user-select: none;
        }

        #smoke-effect {
            position: absolute;
            top: 20%; left: 50%;
            width: 50px; height: 50px;
            background: radial-gradient(circle, #fff, #a29bfe, transparent);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes smokeExpand {
            0% { transform: scale(0); opacity: 0; filter: blur(5px); }
            50% { opacity: 1; filter: blur(20px); }
            100% { transform: scale(30); opacity: 0; filter: blur(40px); }
        }

        #genie-ui {
            display: none;
            animation: fadeIn 1s forwards;
        }

        .wish-input {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            width: 250px;
            margin: 15px 0;
            font-size: 16px;
        }

        .magic-btn {
            background: linear-gradient(45deg, #ffd700, #ff9f00);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* --- PAGE 2: BIRTHDAY CELEBRATION --- */
        #page2 {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            flex-direction: column;
            align-items: center;
            padding: 40px 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .slideshow-frame {
            width: 100%;
            height: 350px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid white;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.1);
        }

        #slide-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.6s ease;
        }

        #typewriter-note {
            font-size: 18px;
            line-height: 1.6;
            min-height: 120px;
            color: white;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* --- GLOBAL ANIMATIONS --- */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="page1">
        <h2 id="hint-text">Rub the lamp to summon the Genie... ✨</h2>
        <div class="lamp-wrapper" onclick="handleRub()">
            <div id="smoke-effect"></div>
            <div id="lamp-img">🪔</div>
        </div>

        <div id="genie-ui">
            <h1 style="font-size: 60px; margin: 10px 0;">🧞‍♂️</h1>
            <h3>"I am the Birthday Genie! Ask for a wish, Priyanshi."</h3>
            <input type="text" id="wishText" class="wish-input" placeholder="Your secret wish..."><br>
            <button class="magic-btn" onclick="grantWish()">Grant Wish ✨</button>
        </div>
    </div>

    <div id="page2">
        <div class="main-card">
            <h2 style="margin-top:0;">Happy Birthday, Priyanshi! 🎂</h2>
            <div class="slideshow-frame">
                <img id="slide-img" src="photo1.jpg">
            </div>
            <div id="typewriter-note"></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. EmailJS Setup
        (function() { 
            emailjs.init("R2J4WoqG1vVEahNbF"); // <-- CHANGE THIS
        })();

        let rubCount = 0;
        let charIndex = 0;
        let typingTimer;
        const noteText = "hi Priyanshi, aap sach me special hai! Is saal apke saare sapne pure ho aur apki smile hamesha aise hi bani rahe. Ye chota sa surprise apke liye! Have a blast! ❤️";
        const images = ["photo1.jpg", "photo2.jpg", "photo3.jpg"]; // <-- CHECK FILENAMES

        // 2. Lamp Rub Logic
        function handleRub() {
            rubCount++;
            const lamp = document.getElementById('lamp-img');
            const smoke = document.getElementById('smoke-effect');
            
            lamp.style.transform = `rotate(${rubCount % 2 === 0 ? 10 : -10}deg) scale(1.1)`;
            setTimeout(() => { lamp.style.transform = "rotate(0) scale(1)"; }, 150);

            if (rubCount === 3) {
                smoke.style.animation = "smokeExpand 1.5s forwards";
                setTimeout(() => {
                    document.getElementById('lamp-img').style.display = "none";
                    document.getElementById('hint-text').style.display = "none";
                    document.getElementById('genie-ui').style.display = "block";
                }, 800);
            }
        }

        // 3. Email & Transition
        function grantWish() {
            const wish = document.getElementById('wishText').value;
            if(!wish) { alert("Genie needs a wish!"); return; }

            const btn = document.querySelector('.magic-btn');
            btn.disabled = true;
            btn.innerHTML = "Processing...";

            emailjs.send("service_07qqc6k", "template_ijxvpcp", { // <-- CHANGE THESE
                message: wish,
                to_name: "Priyanshi"
            }).then(() => {
                transitionToBirthday();
            }).catch(() => {
                transitionToBirthday(); // Aage badho fallback ke liye
            });
        }

        function transitionToBirthday() {
            document.getElementById('page1').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('page1').style.display = "none";
                document.getElementById('page2').style.display = "flex";
                const music = document.getElementById('bgMusic');
                music.play().catch(() => console.log("Music click required"));
                startEverything();
            }, 800);
        }

        // 4. Final Page Animations
        function startEverything() {
            // Slideshow
            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % images.length;
                const img = document.getElementById('slide-img');
                img.style.opacity = "0";
                setTimeout(() => {
                    img.src = images[idx];
                    img.style.opacity = "1";
                }, 400);
            }, 3000);

            // Typewriter
            typeWriter();

            // Sparkles
            setInterval(createSparkle, 300);
        }

        function typeWriter() {
            const container = document.getElementById("typewriter-note");
            clearTimeout(typingTimer);
            if (charIndex < noteText.length) {
                container.innerHTML += noteText.charAt(charIndex);
                charIndex++;
                typingTimer = setTimeout(typeWriter, 50);
            }
        }

        function createSparkle() {
            const sparkle = document.createElement("div");
            sparkle.className = "sparkle";
            sparkle.innerHTML = "✨";
            sparkle.style.left = Math.random() * 100 + "vw";
            sparkle.style.top = "100vh";
            sparkle.style.fontSize = (Math.random() * 20 + 10) + "px";
            sparkle.style.transition = "all 4s linear";
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                sparkle.style.opacity = "0";
            }, 100);
            setTimeout(() => sparkle.remove(), 4000);
        }
    </script>
</body>
</html>
